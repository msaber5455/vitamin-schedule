<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>جدول الفيتامينات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="bg-gradient"></div>

<div class="container">
  <!-- Header -->
  <header class="header">
    <div class="header-icon">💊</div>
    <h1>جدول الفيتامينات</h1>
    <p class="header-sub">تابع جرعاتك اليومية بسهولة</p>
  </header>

  <!-- Setup Card -->
  <div class="card setup-card" id="setupCard">
    <h2>⚙️ إعداد الكورس</h2>
    <div class="setup-row">
      <label>تاريخ بداية الكورس:</label>
      <input type="date" id="startDate" />
    </div>
    <button class="btn-primary" id="startBtn" onclick="startCourse()">🚀 ابدأ التتبع</button>
  </div>

  <!-- Main Tracker -->
  <div id="trackerSection" class="hidden">

    <!-- Info Bar -->
    <div class="info-bar">
      <div class="info-item">
        <span class="info-label">📅 اليوم</span>
        <span class="info-value" id="todayDisplay"></span>
      </div>
      <div class="info-item">
        <span class="info-label">📆 اليوم رقم</span>
        <span class="info-value" id="dayNumber"></span>
      </div>
      <div class="info-item phase-badge" id="phaseBadge">
        <span id="phaseText"></span>
      </div>
      <button class="btn-reset" onclick="resetCourse()">🔄 إعادة ضبط</button>
    </div>

    <!-- Navigation -->
    <div class="nav-bar">
      <button class="nav-btn" id="prevDayBtn" onclick="changeDay(-1)">‹ السابق</button>
      <div class="nav-date" id="navDate"></div>
      <button class="nav-btn" id="nextDayBtn" onclick="changeDay(1)">التالي ›</button>
    </div>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">0 / 0 مكتمل</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Timing Sections -->
    <div id="pillSections"></div>

    <!-- Save Button -->
    <button class="btn-save" onclick="saveDay()">💾 حفظ اليوم</button>

    <!-- History -->
    <div class="card history-card">
      <h2>📊 سجل الأيام</h2>
      <div id="historyGrid"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
